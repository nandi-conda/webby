# CI for webby on the fileapi forge (https://fileapi.fastapicloud.dev/forge/nandi.uk/webby). No GitHub involved:
# jobs run on Depot (DEPOT_TOKEN + DEPOT_PROJECT_ID user secrets) and publish to this forge's releases.

# The AppImage, on every push to main: builds this commit's webby conda package with rattler-build, packs it with
# scripts/build_appimage.sh, checks it starts under Xvfb on Ubuntu 22.04 (the oldest glibc it supports) and puts
# webby-x86_64.AppImage + .zsync on a release of its own, appimage-<version> (the newest 5 kept), and on the
# rolling `appimage` release webby's updater reads. See scripts/forge_appimage.py.
[[job]]
name = "appimage"
branches = ["main"]
timeout = 3600
image = "ubuntu:22.04"
run = """
export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
apt-get install -y -qq --no-install-recommends ca-certificates curl python3 xvfb xauth procps file \
  desktop-file-utils > /dev/null
curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.56.0 bash > /dev/null
python3 -u scripts/forge_appimage.py
"""

# webby in WebAssembly (wasm/README.md), in two jobs that each run a `depot build` with cache mounts Depot keeps
# between runs. See wasm/ci/forge_wasm.py.
# wasm-deps: the WASI sysroot (wasm/deps/all.sh: ICU, OpenSSL, Skia, FFmpeg, ... and the patched wasm-opt) as
# webby-wasi-sysroot-<key>.tar.zst on the rolling `wasm-deps` release. The key hashes the scripts that make it, so
# a push that doesn't touch them builds nothing.
[[job]]
name = "wasm-deps"
branches = ["main"]
timeout = 3600
run = "depot --version && python3 -u wasm/ci/forge_wasm.py deps"

# wasm-engine: Ladybird with patches/ and wasm/patches/ for wasm32-wasip1 against that sysroot; the programs in
# wasm/ci/engine-targets (js, webby-render, the Qt UI webby.wasm, ...) go on a release of their own, webby-wasm-<version>
# (the newest 3 kept), and on the rolling `wasm-engine` release (the fixed address for updates and precompiled files). A cold build takes longer than the
# job's hour: it stops in time, keeps its build directory in Depot's cache and starts this job again to carry on.
[[job]]
name = "wasm-engine"
branches = ["main"]
after = "wasm-deps"
timeout = 3600
run = "depot --version && python3 -u wasm/ci/forge_wasm.py engine"

# wasm-test: a webby.wasm from a test branch, on the same warm cache, before the change goes to main. Only webby-ui;
# no version, update manifest or per-build release: the files go on a release named as the branch. Branches named
# wasm-test-<something> can list themselves here for a release of their own.
[[job]]
name = "wasm-test"
branches = ["wasm-test"]
timeout = 3600
run = "depot --version && WASM_TEST=1 WASM_TARGETS=webby-ui python3 -u wasm/ci/forge_wasm.py engine"
