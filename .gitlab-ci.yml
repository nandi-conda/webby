# Publishes the conda packages to prefix.dev/nandi-testing on pushes to main.
# Needs a runner with internet access (Flutter fetches pub packages) and the masked CI variable PREFIX_API_KEY,
# a prefix.dev API key with upload rights to the channel.
#
# - webby (the app) is rebuilt on every push to main; its version is the commit date and its build number the
#   pipeline number, so every publish is new.
# - webby-ladybird only repackages the prebuilt Ladybird tarball named in its recipe, so it's republished when
#   conda/webby-ladybird/ changes (bump the recipe's version/sha256 or build number after uploading a new prebuilt).
#   Rebuilding Ladybird itself (LADYBIRD_COMMIT, native/, scripts/build_ladybird.sh) still happens on the Fly build machine.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")

stages:
  - ladybird
  - app

default:
  image: ghcr.io/prefix-dev/pixi:0.56.0
  before_script:
    - command -v pixi >/dev/null || { curl -fsSL https://pixi.sh/install.sh | bash; }
    - export PATH="$HOME/.pixi/bin:$PATH"
    - command -v rattler-build >/dev/null || pixi global install rattler-build
  interruptible: false

variables:
  CHANNEL: nandi-testing
  OUT: $CI_PROJECT_DIR/build/conda

webby-ladybird:
  stage: ladybird
  rules:
    - changes:
        - conda/webby-ladybird/**/*
        - scripts/publish_conda.sh
  resource_group: publish-webby-ladybird
  script:
    - scripts/publish_conda.sh webby-ladybird

webby:
  stage: app
  needs:
    - job: webby-ladybird
      optional: true
  resource_group: publish-webby
  script:
    - export WEBBY_VERSION="$(echo "$CI_COMMIT_TIMESTAMP" | cut -c1-10 | tr - .)"
    - export WEBBY_BUILD_NUMBER="$CI_PIPELINE_IID"
    - echo "publishing webby $WEBBY_VERSION build $WEBBY_BUILD_NUMBER"
    - scripts/publish_conda.sh webby
