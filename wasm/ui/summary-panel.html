<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Summary</title>
<!-- The side panel of Summarize and Ask AI (SummaryPanel.cpp), shown in a view of its own beside the page. The window
     sends it its state with webbyPanel.render(state); the panel answers with prompt(prefix + JSON), the page message
     channel of every view (WebView::on_page_message). -->
<style>
:root { color-scheme: light dark; --fg: #1f1f1f; --dim: #5f6368; --bg: #ffffff; --soft: rgba(0,0,0,0.06);
  --line: rgba(0,0,0,0.12); --accent: #1a73e8; --error: #c5221f; --field: #f1f3f4; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e8eaed; --dim: #9aa0a6; --bg: #202124; --soft: rgba(255,255,255,0.08); --line: rgba(255,255,255,0.14);
    --accent: #8ab4f8; --error: #f28b82; --field: #303134; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 "Liberation Sans", sans-serif; display: flex;
  flex-direction: column; border-left: 1px solid var(--line); overflow: hidden; }
button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--soft); }
button:disabled { opacity: 0.45; cursor: default; background: transparent; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.icon { border: none; border-radius: 50%; width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
#bar { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); flex: none; }
#heading { font-weight: bold; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#busy { color: var(--dim); font-size: 12px; white-space: nowrap; }
#scroller { flex: 1; overflow-y: auto; padding: 14px; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.title { font-weight: bold; }
.url { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.error { color: var(--error); margin-top: 12px; }
.gap { margin-top: 12px; }
.quote { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.question { background: var(--soft); border-radius: 6px; padding: 7px 10px; margin-top: 16px; }
.question .q { font-weight: bold; white-space: pre-wrap; overflow-wrap: anywhere; }
.question .quote { margin-bottom: 6px; color: var(--dim); }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.md { overflow-wrap: anywhere; }
.md p { margin: 0.5em 0; }
.md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
.md li { margin: 0.25em 0; line-height: 1.3; }
.md h1 { font-size: 1.35em; margin: 0.7em 0 0.3em; }
.md h2 { font-size: 1.2em; margin: 0.7em 0 0.3em; }
.md h3, .md h4, .md h5, .md h6 { font-size: 1.08em; margin: 0.7em 0 0.3em; }
.md code { font-family: "Liberation Mono", monospace; font-size: 0.92em; background: var(--soft); border-radius: 3px; padding: 0 3px; }
.md pre { background: var(--soft); border-radius: 6px; padding: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); margin: 0.5em 0; padding-left: 10px; color: var(--dim); }
.md a { color: var(--accent); text-decoration: none; cursor: pointer; }
.md a:hover { text-decoration: underline; }
.md a.source { font-size: 0.85em; padding: 0 2px; }
#quoting { display: none; padding: 8px 8px 0; border-top: 1px solid var(--line); flex: none; }
#quoting .row { display: flex; gap: 4px; align-items: flex-start; margin-bottom: 4px; }
#quoting .quote { flex: 1; color: var(--dim); max-height: 4.2em; overflow: hidden; }
#ask { display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--line); flex: none; }
#quoting + #ask { border-top: none; }
#entry { flex: 1; font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; resize: none; height: 34px; }
#entry:disabled { opacity: 0.6; }
#pill { position: fixed; display: none; z-index: 10; background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,0.3); border-radius: 16px; }
#settings { display: none; flex: 1; overflow-y: auto; padding: 14px; }
#settings label { display: block; margin-top: 10px; }
#settings label select, #settings label input { display: block; }
#settings select, #settings input[type=password], #settings input[type=text] { font: inherit; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; margin-top: 4px; }
#settings .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
#settings .buttons { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
#settings .buttons .left { margin-right: auto; }
</style>
</head>
<body>
<div id="bar">
  <span id="heading">Summary</span>
  <span id="busy"></span>
  <button class="icon" id="copy" title="Copy summary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
  <button class="icon" id="redo" title="Summarize again"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
  <button class="icon" id="gear" title="Summarize settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  <button class="icon" id="close" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div id="scroller"><div id="content"></div></div>
<div id="settings">
  <div class="title">Summarize settings</div>
  <label>Summarize with<select id="provider"></select></label>
  <label id="keylabel">API key<input type="password" id="key" placeholder="Paste the key" autocomplete="off"></label>
  <div class="check"><input type="checkbox" id="show"><span>Show key</span></div>
  <div class="check" id="syncrow"><input type="checkbox" id="sync"><span>Sync this key to my other devices</span></div>
  <p class="dim small" id="info"></p>
  <div class="buttons">
    <button class="left" id="remove">Remove key</button>
    <button id="cancel">Cancel</button>
    <button class="primary" id="save">Save</button>
  </div>
</div>
<div id="quoting">
  <div class="row"><div class="quote" id="quotetext"></div><button class="icon" id="unquote" title="Don't ask about this"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="quick" id="quotequick"></div>
</div>
<div id="ask"><textarea id="entry" rows="1" placeholder="Ask about this page"></textarea><button class="icon" id="send" title="Ask"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-6z"/></svg></button></div>
<button id="pill">✦ Ask AI about this</button>
<script>
(() => {
  let PREFIX = null;
  let state = null;
  let settingsOpen = false;
  let follow = true;
  const $ = (id) => document.getElementById(id);
  const send = (message) => {
    if (PREFIX === null) return;
    const text = PREFIX + JSON.stringify(message);
    setTimeout(() => { try { window.prompt(text); } catch (e) {} }, 0);
  };

  // Markdown, the part the prompts ask for: headings, bullet and numbered lists, paragraphs, quotes, code, bold,
  // italics and links. A source link [§](#words) jumps to those words on the page.
  const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inline = (text) => {
    const codes = [];
    let s = text.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = escape(s);
    s = s.replace(/\[([^\]]*)\]\(([^)\n]*)\)/g, (m, label, href) => {
      if (href.startsWith('#')) {
        const words = href.slice(1);
        return '<a class="source" data-words="' + words + '" title="Show this on the page">' + (label || '§') + '</a>';
      }
      href = href.trim();
      if (!/^https?:\/\/\S+$/i.test(href)) return label;
      return '<a data-href="' + href + '" title="' + href + '">' + label + '</a>';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<b>$1</b>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?=[^*\w]|$)/g, '$1<i>$2</i>');
    s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + escape(codes[+i]) + '</code>');
    return s;
  };
  const markdown = (src) => {
    const lines = src.replace(/\r/g, '').split('\n');
    let html = '';
    const stack = []; // open lists: {type, indent}
    let para = [];
    const flushPara = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    const closeLists = (indent) => {
      while (stack.length && stack[stack.length - 1].indent >= indent) html += '</li></' + stack.pop().type + '>';
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s*```/.test(line)) {
        flushPara(); closeLists(0);
        const code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
        html += '<pre><code>' + escape(code.join('\n')) + '</code></pre>';
        continue;
      }
      if (!line.trim()) { flushPara(); continue; }
      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) { flushPara(); closeLists(0); html += '<h' + m[1].length + '>' + inline(m[2].replace(/\s*#+\s*$/, '')) + '</h' + m[1].length + '>'; continue; }
      m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (m) {
        flushPara();
        const indent = m[1].replace(/\t/g, '    ').length;
        const type = /\d/.test(m[2]) ? 'ol' : 'ul';
        const top = stack[stack.length - 1];
        if (top && indent > top.indent) {
          stack.push({ type, indent }); html += '<' + type + '><li>';
        } else {
          closeLists(indent + 1);
          const t = stack[stack.length - 1];
          if (t && t.indent === indent && t.type === type) html += '</li><li>';
          else { if (t && t.indent === indent) html += '</li></' + stack.pop().type + '>'; stack.push({ type, indent }); html += '<' + type + '><li>'; }
        }
        html += inline(m[3]);
        continue;
      }
      m = line.match(/^\s*>\s?(.*)$/);
      if (m) { flushPara(); closeLists(0); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
      if (stack.length && /^\s+/.test(line)) { html += ' ' + inline(line.trim()); continue; }
      closeLists(0);
      para.push(line.trim());
    }
    flushPara(); closeLists(0);
    return '<div class="md">' + html + '</div>';
  };

  const node = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const quickButtons = (into, list) => {
    for (const [label, question] of list) {
      const b = node('button', '', label);
      b.disabled = !state.canAsk || state.answering;
      b.onclick = () => send({ op: 'ask', question });
      into.appendChild(b);
    }
  };

  const render = () => {
    const s = state;
    if (!s) return;
    $('heading').textContent = s.heading;
    $('busy').textContent = s.busy;
    $('copy').disabled = !s.copyable;
    $('copy').title = s.asking ? 'Copy answer' : 'Copy summary';
    $('redo').style.display = s.asking ? 'none' : '';
    $('redo').disabled = !s.canRedo;
    const scroller = $('scroller');
    const atEnd = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 24;
    const c = $('content');
    c.textContent = '';
    if (s.title) c.appendChild(node('div', 'title', s.title));
    if (s.url) c.appendChild(node('div', 'url', s.url));
    if (s.asking) {
      c.appendChild(node('div', 'quote gap', s.selected));
      if (!s.questions.length) {
        if (!s.hasKey) c.appendChild(node('div', 'dim gap', 'Add an API key in Summarize settings (the gear above) to ask about it.'));
        else { const q = node('div', 'quick gap'); quickButtons(q, s.quick); c.appendChild(q); }
      }
    }
    if (s.saved) c.appendChild(node('div', 'dim small gap', s.saved));
    if (s.error) c.appendChild(node('div', 'error', s.error));
    else if (!s.asking) {
      if (s.waiting) c.appendChild(node('div', 'dim gap', s.waiting));
      else if (s.text) { const d = node('div', 'gap'); d.innerHTML = markdown(s.text); c.appendChild(d); }
    }
    for (const qa of s.questions) {
      const box = node('div', 'question');
      if (qa.quote) box.appendChild(node('div', 'quote', qa.quote));
      box.appendChild(node('div', 'q', qa.question));
      c.appendChild(box);
      for (const line of qa.searches) c.appendChild(node('div', 'dim small gap', line));
      if (qa.notice) c.appendChild(node('div', 'dim small gap', qa.notice));
      if (qa.answer) { const d = node('div', 'gap'); d.innerHTML = markdown(qa.answer); c.appendChild(d); }
      else if (qa.thinking) c.appendChild(node('div', 'dim gap', 'Thinking…'));
      if (qa.error) c.appendChild(node('div', 'error', qa.error));
    }
    if (!s.hasKey && !s.asking && !s.text && !s.error)
      c.appendChild(node('div', 'dim gap', 'Summarize needs an API key: open Summarize settings (the gear above).'));
    $('quoting').style.display = s.quote ? 'block' : 'none';
    $('quotetext').textContent = s.quote || '';
    const qq = $('quotequick'); qq.textContent = ''; if (s.quote) quickButtons(qq, s.panelQuick);
    const entry = $('entry');
    entry.disabled = !s.canAsk;
    entry.placeholder = s.quote ? 'Ask about the quoted text' : s.asking ? 'Ask about the selection' : 'Ask about this page';
    $('send').disabled = !s.canAsk || s.answering;
    if (follow && atEnd || s.scrollToEnd) scroller.scrollTop = scroller.scrollHeight;
    hidePill();
    showSettings(settingsOpen);
  };

  // Settings, in place of the summary.
  const showSettings = (open) => {
    settingsOpen = open;
    $('settings').style.display = open ? 'block' : 'none';
    $('scroller').style.display = open ? 'none' : '';
    $('ask').style.display = open ? 'none' : '';
    if (open) $('quoting').style.display = 'none';
  };
  const fillSettings = () => {
    const s = state.settings;
    const select = $('provider');
    if (!select.options.length) for (const p of s.providers) { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; select.appendChild(o); }
    updateSettings();
  };
  const updateSettings = () => {
    const s = state.settings;
    const p = s.providers.find((x) => x.id === $('provider').value) || s.providers[0];
    $('keylabel').firstChild.textContent = p.hasKey ? 'New ' + p.name + ' API key (one is saved)' : p.name + ' API key';
    $('sync').checked = p.syncs;
    $('syncrow').style.display = s.vault ? '' : 'none';
    $('remove').disabled = !p.hasKey;
    $('info').textContent = 'Create a key at ' + p.site + '. ' + (s.vault
      ? 'It is kept encrypted in the password vault; when it syncs, it travels end-to-end encrypted like your passwords.'
      : "The password vault isn't open, so the key is kept in memory until webby quits.") + ' Summarize sends the page\'s text to ' + p.name + '.';
  };
  const openSettings = () => {
    $('provider').value = state.settings.chosen;
    $('key').value = '';
    fillSettings();
    showSettings(true);
    $('key').focus();
  };
  $('provider').onchange = updateSettings;
  $('show').onchange = () => { $('key').type = $('show').checked ? 'text' : 'password'; };
  const finishSettings = (op) => {
    const key = $('key').value.trim();
    const p = state.settings.providers.find((x) => x.id === $('provider').value);
    if (op === 'save' && !key && !(p && p.hasKey)) { $('key').focus(); return; }
    send({ op: 'settings', action: op, provider: $('provider').value, key, sync: $('sync').checked });
    $('key').value = '';
    showSettings(false);
  };
  $('save').onclick = () => finishSettings('save');
  $('remove').onclick = () => finishSettings('remove');
  $('cancel').onclick = () => { $('key').value = ''; showSettings(false); send({ op: 'settings', action: 'cancel' }); };
  $('key').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); finishSettings('save'); } };

  $('copy').onclick = () => send({ op: 'copy' });
  $('redo').onclick = () => { follow = false; send({ op: 'redo' }); };
  $('gear').onclick = () => (settingsOpen ? showSettings(false) : openSettings());
  $('close').onclick = () => send({ op: 'close' });
  $('unquote').onclick = () => send({ op: 'unquote' });
  const ask = () => {
    const q = $('entry').value.trim();
    if (!q || !state || !state.canAsk || state.answering) return;
    $('entry').value = '';
    follow = true;
    send({ op: 'ask', question: q });
  };
  $('send').onclick = ask;
  $('entry').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } };
  $('scroller').addEventListener('scroll', () => {
    const s = $('scroller');
    follow = s.scrollTop + s.clientHeight >= s.scrollHeight - 24;
  });
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    if (a.dataset.words !== undefined) send({ op: 'jump', words: a.dataset.words });
    else if (a.dataset.href) send({ op: 'open', url: a.dataset.href });
  });

  // Selecting text in the summary or an answer: the next question can be about it.
  let pillText = '';
  const hidePill = () => { $('pill').style.display = 'none'; pillText = ''; };
  $('pill').onmousedown = (e) => e.preventDefault();
  $('pill').onclick = () => { const t = pillText; hidePill(); if (t) send({ op: 'quote', text: t }); };
  document.addEventListener('mousedown', (e) => { if (e.target !== $('pill')) hidePill(); });
  document.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !state || !state.canAsk || settingsOpen) return;
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? String(sel).trim() : '';
      if (!text || !$('content').contains(sel.anchorNode)) return;
      pillText = text.slice(0, 4000);
      const pill = $('pill');
      pill.style.display = 'block';
      const w = pill.offsetWidth || 160, h = pill.offsetHeight || 30;
      let x = Math.min(Math.max(4, e.clientX - w / 2), window.innerWidth - w - 4);
      let y = e.clientY + 14;
      if (y + h > window.innerHeight - 4) y = e.clientY - h - 14;
      pill.style.left = x + 'px';
      pill.style.top = y + 'px';
    }, 10);
  });

  window.webbyPanel = {
    init(prefix) { PREFIX = prefix; },
    render(s) {
      state = s;
      if (s.openSettings) { render(); openSettings(); return; }
      render();
      if (settingsOpen) fillSettings();
    },
    focusEntry() { if (!settingsOpen) $('entry').focus(); },
  };
})();
</script>
</body>
</html>
