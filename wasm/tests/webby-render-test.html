<!doctype html>
<html><head><style>
body { font-family: sans-serif; margin: 24px; background: #f4f1ea; }
h1 { color: #2d5a88; }
.box { display: flex; gap: 12px; }
.box div { width: 120px; height: 80px; border-radius: 12px; }
.a { background: linear-gradient(135deg, #e66, #fa4); }
.b { background: #4a8; transform: rotate(-6deg); }
.c { border: 6px dashed #36c; }
</style></head><body>
<h1>Hello from webby.wasm</h1>
<p>This page was laid out and painted by LibWeb running inside WebAssembly.</p>
<div class="box"><div class="a"></div><div class="b"></div><div class="c"></div></div>
<p id="js">JavaScript did not run.</p>
<script>document.getElementById("js").textContent = "JavaScript ran: 6 * 7 = " + (6 * 7);</script>
</body></html>
