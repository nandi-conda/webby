# Runs the Dagger checks (.dagger/, `dagger check`) on every push to main and on demand.
# With the repo secret DAGGER_CLOUD_TOKEN (dagger.cloud > your org > Settings > Tokens) each run's trace shows up in
# Dagger Cloud; without it the checks still run, just with no trace.
# Set the org or repo variable DAGGER_SCALE_OUT to "true" to run each check on a Dagger Cloud engine instead of this runner,
# whose cache is kept between runs (needs the token, and Cloud Engines on the Dagger Cloud plan).
name: dagger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      twice:
        description: Run the checks a second time in the same job, to show what comes from the cache
        type: boolean
        default: false

concurrency:
  group: dagger-${{ github.ref }}
  cancel-in-progress: true

env:
  # The org/repo variable DAGGER_SCALE_OUT ("true", "1" or "yes") turns on Cloud engines.
  SCALE_OUT: ${{ contains(fromJSON('["true","1","yes"]'), vars.DAGGER_SCALE_OUT) && '--scale-out' || '' }}
  DAGGER_VERSION: 0.21.11  # dagger.json's engineVersion
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
  DAGGER_NO_NAG: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin DAGGER_VERSION=$DAGGER_VERSION sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: dagger check
        run: |
          # When Dagger Cloud won't hand out an engine (wrong token type, plan without Cloud Engines), check on this
          # runner instead of failing the push, and say so on the run.
          if [ -n "$SCALE_OUT" ]; then
            dagger check --progress=plain --scale-out 2>&1 | tee "$RUNNER_TEMP/check.log" && exit 0
            grep -q "failed to provision a remote Engine" "$RUNNER_TEMP/check.log" || exit 1
            echo "::warning::Dagger Cloud engines unavailable ($(grep -o -m1 'failed to provision a remote Engine: .*' "$RUNNER_TEMP/check.log")); checking on this runner"
            echo "SCALE_OUT=" >> "$GITHUB_ENV"
          fi
          dagger check --progress=plain
      - name: dagger check again (cache)
        if: inputs.twice
        run: dagger check --progress=plain $SCALE_OUT
