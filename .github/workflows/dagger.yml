# Runs the Dagger checks (.dagger/, `dagger check`) on every push to main and on demand.
# With the repo secret DAGGER_CLOUD_TOKEN (dagger.cloud > your org > Settings > Tokens) each run's trace shows up in
# Dagger Cloud; without it the checks still run, just with no trace.
# Set the org or repo variable DAGGER_SCALE_OUT to "true" to run the checks on a Dagger Cloud engine instead of this runner
# (signs in with GitHub OIDC; needs the Dagger Cloud GitHub integration and Cloud Engines on the plan).
name: dagger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      twice:
        description: Run the checks a second time in the same job, to show what comes from the cache
        type: boolean
        default: false

concurrency:
  group: dagger-${{ github.ref }}
  cancel-in-progress: true

env:
  # The org/repo variable DAGGER_SCALE_OUT ("true", "1" or "yes") runs the checks on a Dagger Cloud engine. One engine
  # for the whole run (--engine=cloud) keeps its cache between runs; a fresh engine per check (0.21's --scale-out) started
  # with an empty cache every time (runs 19-20), so it bought no speed. On 0.21.11 a rerun was all CACHED (run 23); on
  # 1.0.0-beta.20 each run gets a fresh, cold engine (runs 31-34, with or without -m), ~70 s for the checks.
  SCALE_OUT: ${{ contains(fromJSON('["true","1","yes"]'), vars.DAGGER_SCALE_OUT) && '--engine=cloud' || '' }}
  DAGGER_VERSION: 1.0.0-beta.20  # also in dagger-generate.yml
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
  DAGGER_NO_NAG: "1"

permissions:
  contents: read
  id-token: write  # Cloud Engines sign in with GitHub's OIDC token (DAGGER_CLOUD_TOKEN=oidc), not the telemetry token

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin DAGGER_VERSION=$DAGGER_VERSION sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: dagger check
        run: |
          # When Dagger Cloud won't hand out an engine (wrong token type, plan without Cloud Engines), check on this
          # runner instead of failing the push, and say so on the run.
          if [ -n "$SCALE_OUT" ]; then
            # The telemetry token is sent as Basic auth, which the engine API turns away ("invalid token type"); the
            # CLI's special value "oidc" trades this job's GitHub OIDC token for a Dagger Cloud one instead.
            DAGGER_CLOUD_TOKEN=oidc dagger check --progress=plain $SCALE_OUT 2>&1 | tee "$RUNNER_TEMP/check.log" && exit 0
            grep -q -E "provision a remote Engine|OIDC|Cloud Engine" "$RUNNER_TEMP/check.log" || exit 1
            echo "::warning::Dagger Cloud engines unavailable ($(grep -o -m1 -E '(failed to provision a remote Engine|failed to [a-z ]*OIDC).*' "$RUNNER_TEMP/check.log" | head -c 300)); checking on this runner"
            echo "SCALE_OUT=" >> "$GITHUB_ENV"
          fi
          dagger check --progress=plain
      - name: dagger check again (cache)
        if: inputs.twice
        run: |
          if [ -n "$SCALE_OUT" ]; then export DAGGER_CLOUD_TOKEN=oidc; fi
          dagger check --progress=plain $SCALE_OUT
