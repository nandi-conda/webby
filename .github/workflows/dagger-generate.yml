# Dagger 1.0 wants the module's generated files (the Python SDK in .dagger/sdk and .dagger/clients) committed, and
# `dagger check` fails when they're stale. This runs `dagger generate` and commits the result to the branch it ran on.
# Run it by hand after bumping the Dagger version or changing the module's dependencies.
name: dagger-generate

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DAGGER_VERSION: 1.0.0-beta.20  # keep in step with dagger.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin DAGGER_VERSION=$DAGGER_VERSION sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: dagger generate -y --progress=plain
      - name: commit
        run: |
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "dagger generate (Dagger $DAGGER_VERSION)"
          git push origin HEAD:${{ github.ref_name }}
