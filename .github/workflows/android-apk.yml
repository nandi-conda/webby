# Builds the Android APK on every push to main and publishes it as the GitHub Release `webby-android-<version>`.
#
# Ladybird's Android cross-build is too big for a runner, so its output (libwebby.so, the helper processes as lib*.so,
# assets/lagom.zip) comes from the prebuilt Release named in scripts/android/native.env, made on the Fly build machine
# with scripts/android/release_native.sh. Only the Flutter app is built here. Rebuild and re-release the native part
# when LADYBIRD_COMMIT, native/ or patches/ change, then bump native.env.
#
# Version: commit date plus (100 + run number), e.g. 2026.10.12.101, so it sorts after the hand-built releases; the
# Android versionCode is the run number offset the same way, so each APK installs over the last one.
# Signing: the ANDROID_DEBUG_KEYSTORE secret (base64 of the build machine's ~/.android/debug.keystore), the same debug
# key the earlier APKs were signed with, so phones can update in place. Without it the runner's fresh debug key is used.
name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.5
  NDK_VERSION: 29.0.14206865

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin zstd
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Fetch the prebuilt native part
        run: |
          source scripts/android/native.env
          curl -fsSL --retry 5 -o native.tar.zst \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/webby-android-native-$NATIVE_VERSION/webby-android-native-arm64.tar.zst"
          echo "$NATIVE_SHA256  native.tar.zst" | sha256sum -c -
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; signing with a fresh debug key, so phones must uninstall the old APK first"
          fi
      - name: Build APK
        run: |
          RUN=$((100 + ${{ github.run_number }}))
          VERSION="$(git show -s --format=%cd --date=format:%Y.%m.%d HEAD).$RUN"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          TOOLS="$RUNNER_TEMP/android-tools"
          mkdir -p "$TOOLS"
          ln -sfn "$ANDROID_HOME" "$TOOLS/sdk"
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" "$TOOLS/flutter"
          WEBBY_ANDROID_TOOLS="$TOOLS" WEBBY_ANDROID_NATIVE="$PWD/native.tar.zst" \
            scripts/android/build_apk.sh release --build-name "$VERSION" --build-number "$RUN"
          cp app/build/app/outputs/flutter-apk/app-release.apk webby-android-arm64.apk
          sha256sum webby-android-arm64.apk | tee webby-android-arm64.apk.sha256
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/android/native.env
          gh release create "webby-android-$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "webby for Android $VERSION" \
            --notes "Built by CI from $GITHUB_SHA with native part $NATIVE_VERSION. For arm64 phones on Android 11 or newer (debug-signed). Allow installs from your browser or file manager, then open the APK." \
            webby-android-arm64.apk webby-android-arm64.apk.sha256
