# Publishes the conda packages to prefix.dev/nandi-testing on pushes to main.
# Needs the PREFIX_API_KEY secret (a nandi-conda org secret): a prefix.dev API key with upload rights to the channel.
#
# - webby (the app) is rebuilt on every push to main; its version is the commit date plus the run number
#   (e.g. 2026.10.11.110), so every publish is a newer version and `pixi global update webby` picks it up.
#   (Bumping only the build number isn't enough: pixi global update reports the same version as unchanged.)
#   The run number is offset by 100 so the first GitHub runs sort after the versions GitLab CI published.
# - webby-ladybird only repackages the prebuilt Ladybird tarball named in its recipe (a GitHub Release asset, see
#   prebuilt-release.yml), so it's republished when conda/webby-ladybird/ changes (bump the recipe's version/sha256
#   or build number after releasing a new prebuilt).
#   Rebuilding Ladybird itself (LADYBIRD_COMMIT, native/, scripts/build_ladybird.sh) still happens on a Fly build machine.
# - After that, the same version is packed as webby-x86_64.AppImage onto the rolling `appimage` GitHub release.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CHANNEL: nandi-testing
  PIXI_VERSION: v0.56.0

jobs:
  changes:
    runs-on: depot-ubuntu-24.04
    outputs:
      ladybird: ${{ steps.filter.outputs.ladybird }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ladybird:
              - 'conda/webby-ladybird/**'
              - 'scripts/publish_conda.sh'

  webby-ladybird:
    needs: changes
    if: needs.changes.outputs.ladybird == 'true'
    runs-on: depot-ubuntu-24.04
    outputs:
      version: ${{ steps.publish.outputs.version }}
    concurrency:
      group: publish-webby-ladybird
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      - run: scripts/publish_conda.sh webby-ladybird
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}

  webby:
    needs: webby-ladybird
    # Run after webby-ladybird when it ran, and on its own when it was skipped.
    if: ${{ !cancelled() && needs.webby-ladybird.result != 'failure' }}
    runs-on: depot-ubuntu-24.04
    outputs:
      version: ${{ steps.publish.outputs.version }}
    concurrency:
      group: publish-webby
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      - name: Build and upload webby
        id: publish
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          RUN=$((100 + ${{ github.run_number }}))
          export WEBBY_VERSION="$(git show -s --format=%cd --date=format:%Y.%m.%d HEAD).$RUN"
          export WEBBY_BUILD_NUMBER="$RUN"
          echo "publishing webby $WEBBY_VERSION build $WEBBY_BUILD_NUMBER"
          echo "version=$WEBBY_VERSION" >> "$GITHUB_OUTPUT"
          scripts/publish_conda.sh webby

  # Copies webby's conda-forge run-time closure into nandi-testing (scripts/mirror_deps.sh) so a single-channel
  # `pixi global install -c https://prefix.dev/nandi-testing webby` works, then checks that on a clean Ubuntu 22.04.
  mirror:
    needs: webby
    if: ${{ !cancelled() && needs.webby.result == 'success' }}
    runs-on: depot-ubuntu-24.04
    concurrency:
      group: publish-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      # The webby upload can take a moment to show up in the channel's repodata (Depot runners get here ~10 s after it).
      - run: |
          for i in 1 2 3 4 5; do
            scripts/mirror_deps.sh && break
            [ "$i" = 5 ] && exit 1; sleep 30; pixi clean cache --repodata -y || true
          done
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
          # The webby just published: its closure is what has to be mirrored.
          WEBBY_VERSION: ${{ needs.webby.outputs.version }}

  verify-install:
    needs: [webby, mirror]
    if: ${{ !cancelled() && needs.mirror.result == 'success' }}
    runs-on: depot-ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install from nandi-testing only
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates xvfb xauth procps >/dev/null
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          export PATH="$HOME/.pixi/bin:$PATH"
          # The mirror's uploads can take a moment to show up in the channel's repodata.
          for i in 1 2 3 4 5; do
            # The version just published: a plain `webby` would pass on an older one when the new one can't be solved.
            pixi global install -c https://prefix.dev/$CHANNEL "webby==${{ needs.webby.outputs.version }}" && break
            [ "$i" = 5 ] && exit 1; sleep 30; pixi clean cache --repodata -y || true
          done
          pixi global list
          # Every installed package must have come from nandi-testing.
          if grep -L "prefix.dev/$CHANNEL" "$HOME"/.pixi/envs/webby/conda-meta/*.json | grep .; then
            grep -h '"channel"' "$HOME"/.pixi/envs/webby/conda-meta/*.json | sort | uniq -c; exit 1
          fi
      - name: Launch under Xvfb
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          ENV="$HOME/.pixi/envs/webby"
          if ldd "$ENV/lib/webby/webby" "$ENV"/lib/webby-ladybird/lib/libwebby.so | grep 'not found'; then exit 1; fi
          xvfb-run -a webby https://example.com > webby.log 2>&1 &
          # Wait (up to 60 s) for the page's helper processes instead of a fixed sleep, then check they are still
          # up a few seconds later, so a crash right after start still fails the job.
          up() { pgrep WebContent >/dev/null && pgrep RequestServer >/dev/null; }
          for i in $(seq 120); do up && break; sleep 0.5; done
          up && sleep 3 && up || { cat webby.log; exit 1; }
          echo "helpers up after ~$((i / 2)) s"
          pgrep -a WebContent
          pgrep -a RequestServer

  # The AppImage of the webby just published, made from the same conda packages (scripts/build_appimage.sh), on the
  # rolling `appimage` release: its zsync update information and webby's own updater (nim/src/features/update.nim)
  # read webby-x86_64.AppImage.zsync there, and the release title is the version webby compares with its own.
  appimage:
    needs: [webby, mirror]
    if: ${{ !cancelled() && needs.mirror.result == 'success' }}
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-appimage
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.webby.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Build the AppImage
        run: |
          for i in 1 2 3 4 5; do
            scripts/build_appimage.sh "$VERSION" dist && break
            [ "$i" = 5 ] && exit 1; sleep 30; pixi clean cache --repodata -y || true
          done
      # On a clean Ubuntu 22.04 (the oldest glibc it supports), unpacked since containers have no FUSE.
      - name: Launch under Xvfb on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq xvfb xauth procps > /dev/null
            cd /tmp && /dist/webby-x86_64.AppImage --appimage-extract > /dev/null
            xvfb-run -a squashfs-root/AppRun https://example.com > webby.log 2>&1 &
            up() { pgrep WebContent > /dev/null && pgrep RequestServer > /dev/null; }
            for i in $(seq 120); do up && break; sleep 0.5; done
            up && sleep 3 && up || { cat webby.log; exit 1; }
            echo "helpers up after ~$((i / 2)) s"
            pgrep -a WebContent'
      # The AppImage on the release now, to update from once the new one is up.
      - name: Keep the previous AppImage
        run: |
          mkdir -p old
          curl -fsSL -o old/webby-x86_64.AppImage \
            https://github.com/nandi-conda/webby/releases/download/appimage/webby-x86_64.AppImage || rm -f old/*
      - name: Publish to the appimage release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="webby $VERSION ($GITHUB_SHA), the same build as the conda package \`webby==$VERSION\`.

          Download webby-x86_64.AppImage, \`chmod +x\` it and run it (glibc 2.35 or newer, e.g. Ubuntu 22.04+).
          It updates itself from this release with zsync: ⋮ > Help > Check for updates, or AppImageUpdate / Gear Lever."
          if ! gh release view appimage > /dev/null 2>&1; then
            gh release create appimage --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes" --latest=false
          fi
          # The files first and the title (the version updaters compare with) last.
          gh release upload appimage dist/webby-x86_64.AppImage dist/webby-x86_64.AppImage.zsync --clobber
          git push -f origin "$GITHUB_SHA:refs/tags/appimage"
          gh release edit appimage --title "$VERSION" --notes "$notes"
      # What webby's updater (nim/src/features/update.nim) does, from the previous AppImage: the .zsync and the
      # file's signed address through the release's asset URLs, then zsync2. The result must be the new file.
      - name: Update the previous AppImage with zsync
        run: |
          [ -s old/webby-x86_64.AppImage ] || { echo "no previous AppImage"; exit 0; }
          (cd dist && ./webby-x86_64.AppImage --appimage-extract 'usr/lib/webby/zsync2/*' > /dev/null)
          api=https://api.github.com/repos/nandi-conda/webby/releases/tags/appimage
          asset() { curl -fsSL "$api" | jq -r --arg n "$1" '.assets[] | select(.name == $n) | .url'; }
          curl -fsSL -H 'Accept: application/octet-stream' -o old/new.zsync "$(asset webby-x86_64.AppImage.zsync)"
          location="$(curl -s -o /dev/null -D - -r 0-0 -H 'Accept: application/octet-stream' \
            "$(asset webby-x86_64.AppImage)" | sed -n 's/^[Ll]ocation: *//p' | tr -d '\r')"
          dist/squashfs-root/usr/lib/webby/zsync2/bin/zsync2 -q -i old/webby-x86_64.AppImage -o old/new.AppImage \
            -u "$location" old/new.zsync
          cmp old/new.AppImage dist/webby-x86_64.AppImage
          echo "updated the previous AppImage to the new one with zsync"

  # `pixi run webby` (the Nim front end) from a fresh checkout: installs the workspace, builds and starts it.
  pixi-webby:
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth >/dev/null
          # pixi.toml's glibc platform needs a newer pixi than the PIXI_VERSION the publish jobs use.
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=latest bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: pixi install
        run: |
          for i in 1 2 3 4 5; do
            pixi install && break
            [ "$i" = 5 ] && exit 1; sleep 30; pixi clean cache --repodata -y || true
          done
      - name: pixi run webby
        run: |
          timeout 600 xvfb-run -a pixi run webby https://example.com < /dev/null > nim.log 2>&1 &
          for i in $(seq 120); do
            pgrep -f WebContent >/dev/null && break
            # Stop waiting once it has exited (e.g. couldn't load libwebby.so).
            pgrep -f "pixi run webby" >/dev/null || break
            sleep 5
          done
          sleep 5
          cat nim.log
          test -x nim/webby
          pgrep -a WebContent || { echo "::error::nim/webby built but didn't start Ladybird under Xvfb"; exit 1; }
          pkill -f 'nim/webby|WebContent|RequestServer' || true
