# Publishes the conda packages to prefix.dev/nandi-testing on pushes to main.
# Needs the PREFIX_API_KEY secret (a nandi-conda org secret): a prefix.dev API key with upload rights to the channel.
#
# - webby (the app) is rebuilt on every push to main; its version is the commit date plus the run number
#   (e.g. 2026.10.11.110), so every publish is a newer version and `pixi global update webby` picks it up.
#   (Bumping only the build number isn't enough: pixi global update reports the same version as unchanged.)
#   The run number is offset by 100 so the first GitHub runs sort after the versions GitLab CI published.
# - webby-ladybird only repackages the prebuilt Ladybird tarball named in its recipe (a GitHub Release asset, see
#   prebuilt-release.yml), so it's republished when conda/webby-ladybird/ changes (bump the recipe's version/sha256
#   or build number after releasing a new prebuilt).
#   Rebuilding Ladybird itself (LADYBIRD_COMMIT, native/, scripts/build_ladybird.sh) still happens on a Fly build machine.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CHANNEL: nandi-testing
  PIXI_VERSION: v0.56.0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ladybird: ${{ steps.filter.outputs.ladybird }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ladybird:
              - 'conda/webby-ladybird/**'
              - 'scripts/publish_conda.sh'

  webby-ladybird:
    needs: changes
    if: needs.changes.outputs.ladybird == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-webby-ladybird
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      - run: scripts/publish_conda.sh webby-ladybird
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}

  webby:
    needs: webby-ladybird
    # Run after webby-ladybird when it ran, and on its own when it was skipped.
    if: ${{ !cancelled() && needs.webby-ladybird.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-webby
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      - name: Build and upload webby
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          RUN=$((100 + ${{ github.run_number }}))
          export WEBBY_VERSION="$(git show -s --format=%cd --date=format:%Y.%m.%d HEAD).$RUN"
          export WEBBY_BUILD_NUMBER="$RUN"
          echo "publishing webby $WEBBY_VERSION build $WEBBY_BUILD_NUMBER"
          scripts/publish_conda.sh webby

  # Copies webby's conda-forge run-time closure into nandi-testing (scripts/mirror_deps.sh) so a single-channel
  # `pixi global install -c https://prefix.dev/nandi-testing webby` works, then checks that on a clean Ubuntu 22.04.
  mirror:
    needs: webby
    if: ${{ !cancelled() && needs.webby.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi and rattler-build
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install rattler-build
      - run: scripts/mirror_deps.sh
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}

  verify-install:
    needs: mirror
    if: ${{ !cancelled() && needs.mirror.result == 'success' }}
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install from nandi-testing only
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates xvfb xauth procps >/dev/null
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=$PIXI_VERSION bash
          export PATH="$HOME/.pixi/bin:$PATH"
          # The mirror's uploads can take a moment to show up in the channel's repodata.
          for i in 1 2 3 4 5; do
            pixi global install -c https://prefix.dev/$CHANNEL webby && break
            [ "$i" = 5 ] && exit 1; sleep 30; pixi clean cache --repodata -y || true
          done
          pixi global list
      - name: Launch under Xvfb
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          ENV="$HOME/.pixi/envs/webby"
          if ldd "$ENV/lib/webby/webby" "$ENV"/lib/webby-ladybird/lib/libwebby.so | grep 'not found'; then exit 1; fi
          xvfb-run -a webby https://example.com > webby.log 2>&1 &
          sleep 25
          pgrep -a WebContent || { cat webby.log; exit 1; }
          pgrep -a RequestServer
