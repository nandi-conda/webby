name: webby
description: "A web browser with a Flutter UI on Ladybird LibWeb and LibJS."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  ffi: ^2.2.0
  flatkit:
    git:
      url: https://github.com/codegod100/flutterkit.git
      ref: main
  webby_keyring:
    path: webby_keyring
  webby_texture:
    path: webby_texture
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  # 12+ needs Flutter 3.38; the app builds with 3.35.
  file_picker: ^11.0.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/eruda/eruda.js
