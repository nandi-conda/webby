name: webby
description: "A web browser with a Flutter UI on Ladybird LibWeb and LibJS."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  ffi: ^2.2.0
  webby_keyring:
    path: webby_keyring
  webby_texture:
    path: webby_texture

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
