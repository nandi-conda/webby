name: webby_keyring
description: "Stores the password vault's master key in the desktop keyring (Secret Service) on Linux."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: WebbyKeyringPlugin
