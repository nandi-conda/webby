# `pixi run webby` builds and launches the app (the Nim front end, nim/). The toolchain comes from conda-forge; the
# prebuilt Ladybird runtime (conda/webby-ladybird) from prefix.dev/nandi-testing.
[workspace]
name = "webby"
# conda-forge first: nandi-testing also mirrors the conda-forge packages webby needs (scripts/mirror_deps.sh), and
# under strict channel priority an earlier channel would pin those names to the mirrored copies.
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
# The prebuilt Ladybird runtime is built on Ubuntu 22.04 (scripts/portable_build.sh), so it needs glibc 2.35.
platforms = [{ name = "linux-64-glibc235", platform = "linux-64", glibc = "2.35" }]

[dependencies]
# libwebby.so (LibWeb/LibJS) and the helper processes; activation sets WEBBY_LADYBIRD_PREFIX unless it's already set.
webby-ladybird = ">=2026.10.24.1"
# The password vault's key goes in the desktop keyring through libsecret (loaded at runtime).
libsecret = "*"
# The Nim front end (scripts/pixi_nim.sh): the compiler and its C toolchain, GTK 3, GIO's TLS module for its HTTPS
# (sync, Summarize), the icon theme with its SVG loader for GTK's symbolic icons, and fontconfig for webby-fonts.conf.
nim = ">=2"
clang = ">=19"
lld = "*"
libstdcxx = "*"
sysroot_linux-64 = ">=2.28"
gtk3 = "*"
glib = "*"
# The build asks pkg-config for GTK's flags, which reads these .pc files too.
pkg-config = "*"
epoxy = "*"
expat = "*"
zlib = "*"
glib-networking = "*"
adwaita-icon-theme = "*"
librsvg = "*"
fontconfig = "*"
# Screen recording for pages (navigator.mediaDevices.getDisplayMedia, MediaRecorder): nim/screencast/ grabs the
# screen through the desktop portal and PipeWire (or X11) and encodes WebM with GStreamer.
gstreamer = "*"
gst-plugins-base = "*"
gst-plugins-good = "*"
pipewire = "*"

[tasks]
webby = { cmd = "scripts/pixi_nim.sh", description = "Build (when changed) and run webby's Nim front end; extra args are URLs or --incognito" }
webby-nim = { cmd = "scripts/pixi_nim.sh", description = "Same as `webby` (the old name)" }

# `pixi run -e sync deploy-sync` (or `just deploy-sync`): the Cloudflare sync Worker in sync-worker/. Node gives the
# npx that runs wrangler; uv runs pywrangler. Kept out of the default environment so the app doesn't pull them in.
[feature.sync.dependencies]
nodejs = ">=22"
uv = ">=0.12.3"

[feature.sync.tasks]
deploy-sync = { cmd = "sync-worker/deploy.sh", description = "Deploy the sync server to Cloudflare (wrangler login or CLOUDFLARE_API_TOKEN)" }
dev-sync = { cmd = "uv run pywrangler dev --port 8787", cwd = "sync-worker", description = "Run the sync server locally on :8787" }

[environments]
sync = { features = ["sync"], no-default-feature = true }
