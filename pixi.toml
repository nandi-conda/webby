# `pixi run webby` builds and launches the app.
# The Linux desktop toolchain comes from conda-forge; Flutter (conda/flutter, since it isn't on conda-forge) and the
# prebuilt Ladybird runtime (conda/webby-ladybird) come from prefix.dev/nandi-testing.
[workspace]
name = "webby"
# conda-forge first: nandi-testing also mirrors the conda-forge packages webby needs (scripts/mirror_deps.sh), and
# under strict channel priority an earlier channel would pin those names to the mirrored copies.
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
# The prebuilt Ladybird runtime is built on Ubuntu 22.04 (scripts/portable_build.sh), so it needs glibc 2.35.
platforms = [{ name = "linux-64-glibc235", platform = "linux-64", glibc = "2.35" }]

[dependencies]
# `flutter` and `dart`; the first run downloads the Flutter SDK into ~/.cache/conda-flutter (conda/flutter).
flutter = "3.35.5.*"
# libwebby.so (LibWeb/LibJS) and the helper processes; activation sets WEBBY_LADYBIRD_PREFIX unless it's already set.
webby-ladybird = ">=2026.10.14.1"
# The password vault's key goes in the desktop keyring through libsecret (loaded at runtime).
libsecret = "*"
# Flutter's Linux desktop build: compiler, build tools, GTK 3 and the .pc files its pkg-config lookup pulls in.
clang = ">=19"
clangxx = ">=19"
lld = "*"
sysroot_linux-64 = ">=2.28"
cmake = ">=3.30"
ninja = "*"
pkg-config = "*"
gtk3 = "*"
glib = "*"
epoxy = "*"
fontconfig = "*"
expat = "*"
zlib = "*"
# Used by the Flutter tool.
git = "*"
curl = "*"
xz = "*"
zstd = "*"
tar = "*"
unzip = "*"
which = "*"
# The Nim front end (nim/, `pixi run webby-nim`): the compiler, plus GIO's TLS module for its HTTPS (sync,
# Summarize) and the icon theme with its SVG loader for GTK's symbolic icons.
nim = ">=2"
glib-networking = "*"
adwaita-icon-theme = "*"
librsvg = "*"

[tasks]
webby = { cmd = "scripts/pixi_start.sh", description = "Build and run the Flutter app (extra args go to `flutter run`, e.g. -a https://example.com)" }
webby-nim = { cmd = "scripts/pixi_nim.sh", description = "Build (when changed) and run the Nim front end; extra args are URLs or --incognito" }
