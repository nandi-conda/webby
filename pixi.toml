# `pixi run start` fetches Flutter and the prebuilt Ladybird runtime (once, into third_party/) and launches the app.
# Flutter isn't on conda-forge, so its SDK tarball is downloaded; the Linux desktop toolchain comes from conda-forge.
[workspace]
name = "webby"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Flutter's Linux desktop build: compiler, build tools, GTK 3 and the .pc files its pkg-config lookup pulls in.
clang = ">=19"
clangxx = ">=19"
lld = "*"
sysroot_linux-64 = ">=2.28"
cmake = ">=3.30"
ninja = "*"
pkg-config = "*"
gtk3 = "*"
glib = "*"
epoxy = "*"
fontconfig = "*"
expat = "*"
zlib = "*"
# Used by the Flutter tool and scripts/pixi_fetch.sh.
git = "*"
curl = "*"
xz = "*"
zstd = "*"
tar = "*"
unzip = "*"
which = "*"

[tasks]
fetch = { cmd = "scripts/pixi_fetch.sh", description = "Download Flutter and the prebuilt Ladybird runtime into third_party/ if missing" }
start = { cmd = "scripts/pixi_start.sh", depends-on = ["fetch"], description = "Run webby (extra args go to `flutter run`, e.g. -a https://example.com)" }
