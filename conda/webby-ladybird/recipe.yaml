# conda package of the prebuilt Ladybird runtime (libwebby.so, LibWeb/LibJS and friends, helper processes, share/Lagom).
# It's a self-contained prefix under $PREFIX/lib/webby-ladybird so its bundled vcpkg libraries (ICU, Skia, ffmpeg…)
# never shadow conda-forge's; activation sets WEBBY_LADYBIRD_PREFIX to it.
# Build + upload: scripts/publish_conda.sh (uploads to prefix.dev channel nandi-testing; needs PREFIX_API_KEY).
context:
  version: "2026.10.12.7"

package:
  name: webby-ladybird
  version: ${{ version }}

source:
  # GitHub Release made by .github/workflows/prebuilt-release.yml
  - url: https://github.com/nandi-conda/webby/releases/download/webby-prebuilt-${{ version }}/webby-prebuilt-linux-x64.tar.zst
    sha256: c9df700ab002ef117a669308bb6254cb8b6ffda03531f5e3f41b8a4521d5d89b
  # Ladybird at LADYBIRD_COMMIT, only to rebuild the WebAssembly JIT compiler (a standalone Rust program) with
  # patches/0018 until the prebuilt runtime is rebuilt with it.
  - git: https://github.com/LadybirdBrowser/ladybird.git
    rev: b13bbd5aa8fe71710efe1f1ff2ec7862cfe8231d
    depth: 1
    target_directory: ladybird
    patches:
      - ../../patches/0018-wasm-jit-tier-up-entry-depths.patch

build:
  number: 2
  skip:
    - not linux64
  # Prebuilt binaries; the script points their RPATHs at the bundled lib/ ($ORIGIN-relative) and conda leaves them be.
  prefix_detection:
    ignore: true
  dynamic_linking:
    binary_relocation: false
    overdepending_behavior: ignore
    overlinking_behavior: ignore
  script:
    - mkdir -p $PREFIX/lib/webby-ladybird $PREFIX/etc/conda/activate.d $PREFIX/etc/conda/deactivate.d
    - cp -a lib libexec share $PREFIX/lib/webby-ladybird/
    # The prebuilt's cranelift-compiler crashes WebContent ("VERIFICATION FAILED: count <= size()" in
    # BytecodeInterpreter::call_address) whenever a running loop tiers up into compiled code; patches/0018 fixes it.
    - |
      (
        cd ladybird
        export CARGO_HOME="$SRC_DIR/cargo-home"
        cargo build --release --locked -p libwasm_cranelift --bin cranelift-compiler
        install -m 755 target/release/cranelift-compiler $PREFIX/lib/webby-ladybird/libexec/cranelift-compiler
      )
      ${STRIP:-strip} $PREFIX/lib/webby-ladybird/libexec/cranelift-compiler
    # RUNPATHs: the bundled lib/ first, then the env's lib/ for what the system can't be counted on for (a libstdc++
    # new enough for C++23, libpulse, ncurses), which comes from conda-forge.
    - |
      cd $PREFIX/lib/webby-ladybird
      for f in lib/* libexec/*; do
        [ -f "$f" ] && [ ! -L "$f" ] && [ "$(head -c4 "$f")" = "$(printf '\177ELF')" ] || continue
        case "$f" in lib/*) rp='$ORIGIN:$ORIGIN/../..' ;; *) rp='$ORIGIN/../lib:$ORIGIN/../..' ;; esac
        patchelf --set-rpath "$rp" "$f"
      done
    - cp $RECIPE_DIR/activate.sh $PREFIX/etc/conda/activate.d/webby-ladybird.sh
    - cp $RECIPE_DIR/deactivate.sh $PREFIX/etc/conda/deactivate.d/webby-ladybird.sh

requirements:
  build:
    - patchelf
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    # Its run export sets the glibc floor; newer sysroots would demand glibc 2.39.
    - sysroot_linux-64 2.28.*
  run:
    # Built on Ubuntu 22.04 (scripts/portable_build.sh); scripts/pack_prebuilt.sh prints the glibc the binaries need.
    - __glibc >=2.35
    # Linked against libstdc++ 14; Ubuntu 22.04's own is older.
    - libstdcxx >=14
    - libgcc
    - ncurses
    - pulseaudio-client

tests:
  - package_contents:
      files:
        - lib/webby-ladybird/lib/libwebby.so
        - lib/webby-ladybird/libexec/WebContent
        - lib/webby-ladybird/libexec/RequestServer
        # WebAssembly is interpreted (slowly) without it.
        - lib/webby-ladybird/libexec/cranelift-compiler

about:
  homepage: https://github.com/nandi-conda/webby
  summary: Ladybird's LibWeb/LibJS engine as libwebby.so plus its helper processes, for the webby Flutter browser
  license: BSD-2-Clause
