# The Flutter SDK for conda/pixi environments (Flutter isn't on conda-forge). The package is only a launcher: the first
# `flutter` or `dart` run downloads the official Linux release from Google's storage, checks its sha256 and unpacks
# it into ~/.cache/conda-flutter/<version> (or $CONDA_FLUTTER_ROOT), shared by every environment. The SDK writes into
# its own directory (tool snapshot, stamps, artifacts it fetches later), which is fine there and wouldn't be inside a
# hardlinked package.
# Published to prefix.dev/nandi-testing by .github/workflows/publish.yml when this directory changes.
context:
  version: "3.35.5"
  sha256: 8eead69e5d84131fcfbb2cfd44164c00e9a04df725f24672ea234c6bd136353d

package:
  name: flutter
  version: ${{ version }}

build:
  # Build 0 was the whole SDK repackaged; this launcher supersedes it.
  number: 1
  skip:
    - not linux64
  script:
    - mkdir -p $PREFIX/bin
    - sed -e "s|@VERSION@|${{ version }}|" -e "s|@SHA256@|${{ sha256 }}|" $RECIPE_DIR/flutter.sh > $PREFIX/bin/flutter
    - chmod 755 $PREFIX/bin/flutter
    - ln -s flutter $PREFIX/bin/dart

requirements:
  run:
    # The launcher downloads and unpacks the SDK; the flutter tool reads its version from the SDK's git checkout.
    - curl
    - tar
    - xz
    - git
    - unzip
    - which

tests:
  - package_contents:
      files:
        - bin/flutter
        - bin/dart
