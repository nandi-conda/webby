<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- webby's launcher points FONTCONFIG_FILE here. The UI process reads the env's own fonts.conf through the include,
     as it would without this file. Ladybird's sandboxed helpers (WebContent, Compositor) may only read
     share/Lagom/fonts, where this file lives, so for them the include is skipped quietly instead of each one printing
     "Cannot load default config file". They get their fonts from the UI process, not from fontconfig's dirs. -->
<fontconfig>
  <include ignore_missing="yes">@PREFIX@/etc/fonts/fonts.conf</include>
  <!-- Without any <cachedir>, fontconfig warns about it. -->
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
