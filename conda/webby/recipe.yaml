# conda package of the webby browser itself: a release build of the Nim front end (nim/, GTK through nimkit) plus a
# `webby` launcher. The Ladybird engine comes from the webby-ladybird package; the launcher points the app at it.
# Install: pixi global install -c https://prefix.dev/nandi-testing webby
# Build + upload: scripts/publish_conda.sh webby (needs PREFIX_API_KEY).
# CI sets WEBBY_VERSION (commit date + run number) and WEBBY_BUILD_NUMBER (run number); see .github/workflows/publish.yml.
# scripts/publish_conda.sh sets WEBBY_COMMIT (the git commit, for ⋮ > About).
context:
  version: ${{ env.get("WEBBY_VERSION", default="2026.10.15") }}

package:
  name: webby
  version: ${{ version }}

source:
  - path: ../../nim
    target_directory: nim
  - path: ../../framework
    target_directory: framework
  - path: ../../icons
    target_directory: icons

build:
  number: ${{ env.get("WEBBY_BUILD_NUMBER", default="1") | int }}
  skip:
    - not linux64
  dynamic_linking:
    rpaths:
      - lib/
    overlinking_behavior: ignore
    overdepending_behavior: ignore
  script:
    file: build.sh
    env:
      # The commit shown in ⋮ > About; scripts/publish_conda.sh sets it from git.
      WEBBY_COMMIT: ${{ env.get("WEBBY_COMMIT", default="") }}

requirements:
  build:
    - nim >=2
    - clang >=19
    - lld
    # Its run export sets the glibc floor; newer sysroots would demand glibc 2.39.
    - sysroot_linux-64 2.28.*
    - patchelf
    # The Nim build asks pkg-config for GTK's flags (gtk.nim, gtkapi.nim).
    - pkg-config
    # rsvg-convert renders the icon PNGs.
    - librsvg
  host:
    - gtk3
    - glib
    # .pc files GTK's pkg-config lookup reads.
    - epoxy
    - fontconfig
    - expat
    - zlib
    - libstdcxx
    # The screen recorder (nim/screencast): GStreamer, PipeWire for the portal's stream, Xlib for X11's screen size.
    - gstreamer
    - gst-plugins-base
    - pipewire
    - xorg-libx11
    # The PDF viewer's renderer (nim/pdf/webby-pdf).
    - mupdf
  run:
    - webby-ladybird >=2026.10.24.1
    # The password vault's key goes in the desktop keyring through libsecret (loaded at runtime).
    - libsecret
    - gtk3
    # GIO's TLS module for the front end's own HTTPS (sync, Summarize, site icons).
    - glib-networking
    # GTK's symbolic icons and the SVG loader that draws them.
    - adwaita-icon-theme
    - librsvg
    - fontconfig
    - fonts-conda-ecosystem
    # Linked in so this libstdc++ (new enough for Ladybird's C++23) loads before any older system one.
    - libstdcxx
    - libgcc
    # The screen and tab recorders' encoders and sources (vp8enc, webmmux, ximagesrc, pulsesrc, opusenc).
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - pipewire
    # libmupdf for webby-pdf, the PDF viewer's renderer.
    - mupdf

tests:
  - package_contents:
      files:
        - bin/webby
        - lib/webby/webby
        - lib/webby/webby-screencast
        - lib/webby/webby-tabrec
        - lib/webby/webby-pdf
        - lib/webby-ladybird/share/Lagom/fonts/webby-fonts.conf
        - Menu/webby.json
        - Menu/webby.png
        - share/icons/hicolor/16x16/apps/dev.webby.webby.png
        - share/icons/hicolor/512x512/apps/dev.webby.webby.png

about:
  homepage: https://github.com/nandi-conda/webby
  summary: A web browser in Nim on Ladybird's LibWeb and LibJS
  # webby-pdf links MuPDF, so that program (only) is under the AGPL; the rest of webby is BSD-2-Clause.
  license: BSD-2-Clause AND AGPL-3.0-only
